<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام الحلقات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:#0f172a;background-image:radial-gradient(at 20% 30%, #4e54c8 0%, transparent 50%),radial-gradient(at 80% 70%, #8f94fb 0%, transparent 50%),url("https://cdn.phototourl.com/free/2026-09-13-707c1549-dc15-40b8-9461-e919e3087549.jpg");background-size:cover;background-position:center;background-attachment:fixed;min-height:100vh;color:#fff}
body::before{content:"";position:fixed;inset:0;background:rgba(15,23,42,0.75);backdrop-filter:blur(4px);z-index:-1}
#intro-video{position:fixed;inset:0;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center}
#intro-video video{width:100%;height:100%;object-fit:cover}
#skipIntro{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.2);color:#000;padding:10px 24px;border-radius:30px;cursor:pointer;font-family:'Tajawal';font-size:16px}
.app{max-width:520px;margin:0 auto;padding:20px;min-height:100vh}
.header{text-align:center;padding:40px 0 20px}.header h1{font-size:32px;font-weight:800}.header p{opacity:0.7;margin-top:6px;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.main-card{background:rgba(255,255,255,0.08);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.12);border-radius:20px;padding:20px 15px;text-align:center;cursor:pointer;transition:.2s}.main-card:active{transform:scale(0.96)}.main-card h3{font-size:16px;font-weight:700}
.main-card.full{grid-column:1 / -1}
.main-card.points{background:linear-gradient(135deg,#4e54c8,#8f94fb);border:none}
.main-card.log{background:linear-gradient(135deg,#065f46#fff44336,#10b981);border:none}
.page{display:none;animation:fade.3s ease}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.top-bar{display:flex;align-items:center;gap:12px;margin:10px 0 20px}.back-btn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);color:#fff;width:40px;height:40px;border-radius:12px;cursor:pointer;font-size:18px}.page-title{font-size:22px;font-weight:800;flex:1}
.card{background:rgba(255,255,255,0.08);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.12);border-radius:16px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.del{background:#ef4444;border:none;color:#fff;padding:8px 14px;border-radius:10px;cursor:pointer;font-family:'Tajawal';font-size:13px}
.student-card{background:rgba(255,255,255,0.08);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.12);border-radius:16px;padding:12px;margin-bottom:12px}
.student-card.present{border-color:rgba(34,197,94,0.5);background:rgba(34,197,94,0.1)}
.student-card.no-thobe{border-color:rgba(251,146,60,0.6);background:rgba(251,146,60,0.12)}
.student-card.absent{border-color:rgba(239,68,68,0.5);background:rgba(239,68,68,0.1)}
.student-name-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.student-name{font-size:16px;font-weight:800}
.student-points-badge{background:#fff;color:#0f172a;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:800;min-width:55px;text-align:center}
.att-row-3{display:flex;gap:8px}
.att-btn{flex:1;padding:10px 4px;border-radius:10px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:#fff;cursor:pointer;font-family:'Tajawal';font-size:12px;font-weight:800}
.att-btn.active{color:#000;border-color:transparent}
.att-btn[data-v="present"].active{background:#22c55e}
.att-btn[data-v="no-thobe"].active{background:#fb923c}
.att-btn[data-v="absent"].active{background:#ef4444;color:#fff}
.halaqa-points-card{background:rgba(255,255,255,0.08);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.12);border-radius:18px;padding:14px;margin-bottom:14px}
.point-row{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,0.25);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.point-val{background:rgba(255,255,255,0.15);padding:3px 10px;border-radius:20px;font-weight:800;font-size:13px;min-width:40px;text-align:center}
.btn-add{background:#22c55e;color:#000;border:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-family:'Tajawal';font-weight:800;font-size:12px}
.btn-sub{background:rgba(239,68,68,0.2);color:#fca5a5;border:1px solid rgba(239,68,68,0.3);padding:6px 10px;border-radius:8px;cursor:pointer;font-family:'Tajawal';font-weight:800;font-size:12px}
.total{background:linear-gradient(135deg,#4e54c8,#8f94fb);padding:14px;border-radius:14px;text-align:center;margin-top:14px;font-size:14px;font-weight:800}
.action-btn{width:100%;background:rgba(255,255,255,0.08);border:1px dashed rgba(255,255,255,0.2);color:#fff;padding:12px;border-radius:12px;cursor:pointer;font-family:'Tajawal';font-size:14px;margin-bottom:10px}
.primary-btn{width:100%;background:#fff;color:#0f172a;padding:14px;border-radius:14px;border:none;cursor:pointer;font-family:'Tajawal';font-weight:800;font-size:16px;margin-top:10px}
.input-box{width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.15);border-radius:12px;padding:12px;color:#fff;font-family:'Tajawal';font-size:15px;margin-bottom:10px;outline:none}
textarea{width:100%;height:300px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:14px;color:#fff;font-family:'Tajawal';font-size:13px;resize:none}
.log-card{background:rgba(255,255,255,0.08);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.12);border-radius:18px;padding:14px;margin-bottom:14px}
</style>
</head>
<body>
<div id="intro-video"><video autoplay muted playsinline id="introVid"><source src="https://www.image2url.com/r2/default/videos/1789270661420-634fc81e-182d-406b-b530-b9d0fbf5b8da.mp4" type="video/mp4"></video><button id="skipIntro" onclick="closeIntro()"> <<تخطي</button></div>
<div class="app">
  <div id="mainPage" class="page" style="display:block"><div class="header"><h1>📖 نظام الحلقات</h1><p>إدارة الحلقات والطلاب</p></div>
    <div class="grid">
      <div class="main-card" onclick="openHalagatPage()"><div style="font-size:26px">📚</div><h3>الحلقات</h3></div>
      <div class="main-card" onclick="addHalaqa()"><div style="font-size:26px">➕</div><h3>إضافة حلقة</h3></div>
      <div class="main-card points full" onclick="openHalaqaPointsPage()"><div style="font-size:26px">🏆</div><h3>نقاط الحلقات</h3></div>
      <div class="main-card log" onclick="openLogPage()"><div style="font-size:26px">📋</div><h3>سجل الحضور</h3></div>
      <div class="main-card" onclick="openActivitiesPage()"><div style="font-size:26px">📝</div><h3>الأنشطة</h3></div>
      <div class="main-card" onclick="openSettingsPage()"><div style="font-size:26px">⚙️</div><h3>الإعدادات</h3></div>
      <div class="main-card" onclick="shareText()"><div style="font-size:26px">📊</div><h3>الإحصائيات</h3></div>
    </div>
  </div>
  <div id="halaqatPage" class="page"><div class="top-bar"><button class="back-btn" onclick="goBack()">⬅</button><div class="page-title">الحلقات</div></div><div id="halaqatList"></div></div>
  <div id="halaqaPage" class="page"><div class="top-bar"><button class="back-btn" onclick="goBack()">⬅</button><div class="page-title" id="halaqaName"></div></div><button class="action-btn" onclick="addStudent()">➕ إضافة طالب</button><div id="studentsList"></div><div class="total">حضور اليوم: <span id="totalPoints">0</span> | حاضرين: <span id="presentCount">0</span></div></div>
  <div id="halaqaPointsPage" class="page"><div class="top-bar"><button class="back-btn" onclick="goBack()">⬅</button><div class="page-title">نقاط الحلقات</div></div><div id="halaqaPointsList"></div></div>
  <div id="logPage" class="page"><div class="top-bar"><button class="back-btn" onclick="goBack()">⬅</button><div class="page-title">سجل الحضور</div></div><button class="action-btn" onclick="exportLog()">📤 تصدير السجل واتساب</button><div id="logList"></div></div>
  <div id="activitiesPage" class="page"><div class="top-bar"><button class="back-btn" onclick="goBack()">⬅</button><div class="page-title">الأنشطة</div></div><button class="action-btn" onclick="addActivity()">➕ إضافة نشاط</button><div id="editActivitiesList"></div></div>

  <div id="settingsPage" class="page"><div class="top-bar"><button class="back-btn" onclick="goBack()">⬅</button><div class="page-title">الإعدادات</div></div>

    <div class="card" style="flex-direction:column;align-items:stretch;gap:10px">
      <b>الرمز</b><p id="codeStatus" style="opacity:.6;font-size:12px"></p>
      <input id="oldCodeInput" class="input-box" type="password" placeholder="الرمز القديم" style="display:none">
      <input id="newCodeInput" class="input-box" type="password" placeholder="الرمز الجديد">
      <button class="primary-btn" onclick="saveCode()">حفظ</button>
    </div>

    <div class="card" style="flex-direction:column;align-items:stretch;gap:10px; margin-top:12px; border-color:rgba(251,146,60,0.3)">
      <b>🌙 نهاية اليوم</b>
      <input id="endDayCodeInput" class="input-box" type="password" placeholder="الرمز">
      <button class="primary-btn" style="background:linear-gradient(135deg,#1f2937,#111827);color:#fff;border:1px solid rgba(251,146,60,0.3)" onclick="doEndDay()">تأكيد</button>
    </div>

    <div class="card" style="flex-direction:column;gap:10px;margin-top:12px">
      <b>تصفير الأسبوع</b>
      <input id="resetCodeInput" class="input-box" type="password" placeholder="الرمز">
      <button class="del" style="width:100%;padding:12px" onclick="resetWeekPoints()">تصفير</button>
    </div>

    <div class="card" style="flex-direction:column;gap:10px;margin-top:12px; border-color: rgba(239,68,68,0.5); background: rgba(239,68,68,0.08);">
      <b>إعادة ضبط</b>
      <input id="factoryResetCodeInput" class="input-box" type="password" placeholder="الرمز">
      <button class="del" style="width:100%;padding:12px;background:#991b1b" onclick="factoryResetSite()">إعادة ضبط</button>
    </div>

  </div>

  <div id="sharePage" class="page"><div class="top-bar"><button class="back-btn" onclick="goBack()">⬅</button><div class="page-title">الإحصائيات</div></div><textarea id="exportBox" readonly></textarea><button class="primary-btn" onclick="shareWhatsApp()">واتساب 💬</button></div>
</div>

<script>
let halaqat = JSON.parse(localStorage.getItem("halaqat")||"[]");
const FIXED_ACTIVITY = "الحضور";
let activities = JSON.parse(localStorage.getItem("activities")||"[]");
if(!activities.includes(FIXED_ACTIVITY)){activities.unshift(FIXED_ACTIVITY)}
if(activities.length===0) activities=[FIXED_ACTIVITY,"نشاط ثقافي","نشاط رياضي"];
halaqat.forEach(h=>{ if(!h.groupPoints) h.groupPoints={}; if(h.weeklyAttendance===undefined) h.weeklyAttendance=0; if(!h.students) h.students=[]; h.students.forEach(s=>{ if(s.attendance===undefined) s.attendance=""; if(!s.points) s.points={}; }); });
let attendanceLog = JSON.parse(localStorage.getItem("attendanceLog")||"[]");
let currentHalaqa=null, historyStack=[];
function saveAll(){localStorage.setItem("halaqat",JSON.stringify(halaqat));localStorage.setItem("activities",JSON.stringify(activities));localStorage.setItem("attendanceLog",JSON.stringify(attendanceLog))}
function closeIntro(){document.getElementById("intro-video").style.display="none"}
document.getElementById("introVid").onended=closeIntro;
function hideAll(){document.querySelectorAll(".page").forEach(p=>p.style.display="none")}
function goBack(){if(!historyStack.length){hideAll();document.getElementById("mainPage").style.display="block";return}let last=historyStack.pop();hideAll();document.getElementById(last).style.display="block"}
function openHalagatPage(){historyStack.push("mainPage");hideAll();document.getElementById("halaqatPage").style.display="block";renderHalaqat()}
function openHalaqa(i){historyStack.push("halaqatPage");currentHalaqa=i;hideAll();document.getElementById("halaqaPage").style.display="block";document.getElementById("halaqaName").innerText=halaqat[i].name;renderStudents()}
function openActivitiesPage(){historyStack.push("mainPage");hideAll();document.getElementById("activitiesPage").style.display="block";renderEditActivities()}
function openHalaqaPointsPage(){historyStack.push("mainPage");hideAll();document.getElementById("halaqaPointsPage").style.display="block";renderHalaqaPoints()}
function openSettingsPage(){historyStack.push("mainPage");hideAll();document.getElementById("settingsPage").style.display="block";updateCodeStatus()}
function openLogPage(){historyStack.push("mainPage");hideAll();document.getElementById("logPage").style.display="block";renderLog()}
function updateCodeStatus(){let code=localStorage.getItem("endDayCode");document.getElementById("codeStatus").innerText = code? "يوجد رمز" : "لا يوجد رمز";document.getElementById("oldCodeInput").style.display = code? "block" : "none";}
function shareText(){historyStack.push("mainPage");hideAll();document.getElementById("sharePage").style.display="block";let txt="📖 *نقاط الحلقات*\n\n";halaqat.forEach(h=>{let today = h.students.reduce((s,st)=>s+(st.points&&st.points[FIXED_ACTIVITY]||0),0);let week = h.weeklyAttendance||0;let groupTotal = Object.values(h.groupPoints||{}).reduce((s,v)=>s+v,0);txt+=`📚 ${h.name} - ${week+today+groupTotal}\n`;});document.getElementById("exportBox").value=txt}
function shareWhatsApp(){window.open("https://wa.me/?text="+encodeURIComponent(document.getElementById("exportBox").value),"_blank")}
function renderHalaqat(){let list=document.getElementById("halaqatList");list.innerHTML="";if(halaqat.length==0)list.innerHTML="<div style='text-align:center;opacity:.5;margin-top:40px'>لا يوجد حلقات</div>";halaqat.forEach((h,i)=>{let today = h.students.reduce((s,st)=>s+(st.points&&st.points[FIXED_ACTIVITY]||0),0);let week = h.weeklyAttendance||0;let groupTotal = Object.values(h.groupPoints||{}).reduce((s,v)=>s+v,0);let div=document.createElement("div");div.className="card";div.innerHTML=`<span class="card-name">📚 ${h.name} <small style="opacity:.6">(${(h.students||[]).length} - ${week+today+groupTotal})</small></span>`;let del=document.createElement("button");del.className="del";del.innerText="حذف";del.onclick=(e)=>{e.stopPropagation();if(confirm("تحذف الحلقة؟")){halaqat.splice(i,1);saveAll();renderHalaqat()}};div.appendChild(del);div.onclick=()=>openHalaqa(i);list.appendChild(div)})}
function addHalaqa(){let name=prompt("اسم الحلقة:");if(!name)return;halaqat.push({name,students:[],groupPoints:{},weeklyAttendance:0});saveAll();openHalagatPage()}
function addStudent(){let name=prompt("اسم الطالب:");if(!name)return;let st={name,points:{},attendance:""};st.points[FIXED_ACTIVITY]=0;halaqat[currentHalaqa].students.push(st);saveAll();renderStudents()}
function renderStudents(){let box=document.getElementById("studentsList");box.innerHTML="";let h=halaqat[currentHalaqa];if(h.students.length==0)box.innerHTML="<div style='text-align:center;opacity:.5;margin-top:20px'>لا يوجد طلاب</div>";h.students.forEach((st, idx)=>{if(!st.points) st.points={};if(st.attendance===undefined) st.attendance="";let statusClass = st.attendance===""?"empty":st.attendance;let div=document.createElement("div");div.className=`student-card ${statusClass}`;div.innerHTML=`<div class="student-name-row"><span class="student-name">${st.name}</span><div style="display:flex;gap:6px;align-items:center"><span class="student-points-badge">${st.points[FIXED_ACTIVITY]||0}</span><button onclick="deleteStudent(${idx})" style="background:transparent;border:none;color:rgba(255,255,255,0.4);cursor:pointer">✕</button></div></div><div class="att-row-3"><button class="att-btn ${st.attendance==='present'?'active':''}" onclick="setAttendance(${idx},'present')">✅ حاضر</button><button class="att-btn ${st.attendance==='no-thobe'?'active':''}" onclick="setAttendance(${idx},'no-thobe')">🟧 بدون ثوب</button><button class="att-btn ${st.attendance==='absent'?'active':''}" onclick="setAttendance(${idx},'absent')">❌ غائب</button></div>`;box.appendChild(div)});updateHalaqaTotal();}
function setAttendance(sIdx, status){let st=halaqat[currentHalaqa].students[sIdx];st.attendance=status;if(status==='present') st.points[FIXED_ACTIVITY]=20;else if(status==='no-thobe') st.points[FIXED_ACTIVITY]=10;else if(status==='absent') st.points[FIXED_ACTIVITY]=0;saveAll();renderStudents();}
function updateHalaqaTotal(){let h=halaqat[currentHalaqa];let total=0,present=0;h.students.forEach(st=>{total+=st.points[FIXED_ACTIVITY]||0;if(st.attendance==='present'||st.attendance==='no-thobe')present++});document.getElementById("totalPoints").innerText=total;document.getElementById("presentCount").innerText=present}
function deleteStudent(idx){if(!confirm("تحذف الطالب؟"))return;halaqat[currentHalaqa].students.splice(idx,1);saveAll();renderStudents()}
function renderHalaqaPoints(){
  let box=document.getElementById("halaqaPointsList");box.innerHTML="";
  if(halaqat.length==0){box.innerHTML="<div style='text-align:center;opacity:.5'>ما فيه حلقات</div>";return}
  halaqat.forEach((h, hIdx)=>{
    if(!h.groupPoints) h.groupPoints={};
    if(h.weeklyAttendance===undefined) h.weeklyAttendance=0;
    activities.forEach(a=>{ if(a!==FIXED_ACTIVITY && h.groupPoints[a]===undefined) h.groupPoints[a]=0; });
    let today = h.students.reduce((s,st)=>s+(st.points&&st.points[FIXED_ACTIVITY]||0),0);
    let week = h.weeklyAttendance||0;
    let groupTotal = Object.values(h.groupPoints).reduce((s,v)=>s+v,0);
    let div=document.createElement("div");div.className="halaqa-points-card";
    let actsHTML = "";
    activities.forEach(a=>{
      if(a===FIXED_ACTIVITY) return;
      actsHTML += `<div class="point-row"><b>${a}</b><div style="display:flex;gap:6px;align-items:center"><button class="btn-sub" onclick="changeGroupPoint(${hIdx},'${a}',-5)">-5</button><span class="point-val">${h.groupPoints[a]||0}</span><button class="btn-add" onclick="changeGroupPoint(${hIdx},'${a}',5)">+5</button></div></div>`;
    });
    div.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><b>📚 ${h.name}</b><span class="point-val" style="background:linear-gradient(135deg,#4e54c8,#8f94fb)">${week+today+groupTotal}</span></div>
      <div class="point-row today"><b>حضور اليوم</b><span class="point-val">${today}</span></div>
      <div class="point-row week"><b>حضور الأسبوع</b><span class="point-val">${week}</span></div>
      ${actsHTML}`;
    box.appendChild(div);
  });
}
function changeGroupPoint(hIdx, act, delta){halaqat[hIdx].groupPoints[act] = (halaqat[hIdx].groupPoints[act]||0) + delta; if(halaqat[hIdx].groupPoints[act] < 0) halaqat[hIdx].groupPoints[act]=0; saveAll(); renderHalaqaPoints();}
function renderEditActivities(){let box=document.getElementById("editActivitiesList");box.innerHTML="";activities.forEach((a,i)=>{let div=document.createElement("div");div.className="card";div.innerHTML=`<span class="card-name">${a}</span>`;if(a!==FIXED_ACTIVITY){let del=document.createElement("button");del.className="del";del.innerText="حذف";del.onclick=()=>{if(confirm("تحذف؟")){activities.splice(i,1);halaqat.forEach(h=>{if(h.groupPoints[a]!==undefined) delete h.groupPoints[a]});saveAll();renderEditActivities();}};div.appendChild(del);}box.appendChild(div);})}
function addActivity(){let name=prompt("اسم النشاط:");if(!name)return;if(activities.includes(name))return alert("موجود");activities.push(name);saveAll();renderEditActivities();}
function doEndDay(){
  let code=localStorage.getItem("endDayCode");
  let input=document.getElementById("endDayCodeInput").value;
  if(!code) return alert("حط رمز أول");
  if(input!==code) return alert("الرمز خطأ");
  let todayStr = new Date().toLocaleDateString('ar-EG');
  halaqat.forEach(h=>{
    let today=h.students.reduce((s,st)=>s+(st.points&&st.points[FIXED_ACTIVITY]||0),0);
    h.weeklyAttendance = (h.weeklyAttendance||0)+today;
    let present=h.students.filter(s=>s.attendance==='present').length;
    let noThobe=h.students.filter(s=>s.attendance==='no-thobe').length;
    let absent=h.students.filter(s=>s.attendance==='absent').length;
    attendanceLog.unshift({date:todayStr, halaqa:h.name, today, present, noThobe, absent, students:h.students.map(s=>({name:s.name, att:s.attendance, pts:s.points[FIXED_ACTIVITY]||0}))});
    h.students.forEach(s=>{s.attendance=""; s.points[FIXED_ACTIVITY]=0;});
  });
  saveAll(); document.getElementById("endDayCodeInput").value=""; alert("تم ✅");
}
function saveCode(){
  let stored=localStorage.getItem("endDayCode");
  let oldIn=document.getElementById("oldCodeInput").value;
  let newIn=document.getElementById("newCodeInput").value;
  if(stored && oldIn!==stored) return alert("الرمز خطأ");
  if(!newIn) return alert("اكتب الرمز");
  localStorage.setItem("endDayCode", newIn);
  document.getElementById("oldCodeInput").value=""; document.getElementById("newCodeInput").value="";
  updateCodeStatus(); alert("تم ✅");
}
function resetWeekPoints(){
  let stored=localStorage.getItem("endDayCode");
  let input=document.getElementById("resetCodeInput").value;
  if(!stored) return alert("حط رمز أول");
  if(input!==stored) return alert("الرمز خطأ");
  if(!confirm("تصفر الأسبوع؟")) return;
  halaqat.forEach(h=>{h.weeklyAttendance=0;h.groupPoints={};h.students.forEach(s=>{s.attendance="";s.points={};s.points[FIXED_ACTIVITY]=0;});});
  attendanceLog=[]; saveAll(); document.getElementById("resetCodeInput").value=""; alert("تم ✅");
}
function factoryResetSite(){
  let stored = localStorage.getItem("endDayCode");
  let input = document.getElementById("factoryResetCodeInput").value;
  if(!stored) return alert("ما فيه رمز");
  if(input!== stored) return alert("الرمز خطأ");
  if(!confirm("متأكد؟")) return;
  if(!confirm("تأكيد نهائي")) return;
  localStorage.clear();
  alert("تم مسح كل شيء ✅");
  location.reload();
}
function renderLog(){
  let box=document.getElementById("logList");box.innerHTML="";
  if(attendanceLog.length==0){box.innerHTML="<div style='text-align:center;opacity:.5;margin-top:20px'>لا يوجد سجل</div>";return}
  attendanceLog.forEach(entry=>{
    let div=document.createElement("div");div.className="log-card";
    let studentsHTML = entry.students.map(s=>`<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px dashed rgba(255,255,255,0.08)"><span>${s.name}</span><span>${s.att==='present'?'✅ حاضر':s.att==='no-thobe'?'🟧 بدون ثوب':s.att==='absent'?'❌ غائب':'-'}</span></div>`).join("");
    div.innerHTML=`<div style="display:flex;justify-content:space-between;margin-bottom:8px"><b>📚 ${entry.halaqa}</b><small style="opacity:.6">${entry.date}</small></div>${studentsHTML}`;
    box.appendChild(div);
  });
}
function exportLog(){
  if(attendanceLog.length==0) return alert("فاضي");
  let txt="📋 *سجل الحضور*\n\n";
  attendanceLog.slice(0,15).forEach(e=>{txt+=`📅 ${e.date} - ${e.halaqa}\n`;});
  window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank");
}
</script>
